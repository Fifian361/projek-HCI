<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insert Product — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 220px;
      --orange: #f28c28;
      --orange-dark: #d97a1a;
      --maroon: #6b1a2e;
      --maroon-dark: #561527;
      --border: #e5e7eb;
      --text: #1a1a2e;
      --muted: #6b7280;
      --header-h: 60px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f3f4f6;
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--orange);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
    }

    .sidebar-logo {
      padding: 20px 20px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .sidebar-logo span { font-size: 18px; font-weight: 700; color: white; letter-spacing: -0.3px; }
    .sidebar-logo small { display: block; font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 2px; font-weight: 500; }

    .sidebar-nav { padding: 16px 0; flex: 1; }

    .nav-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: rgba(255,255,255,0.55);
      padding: 8px 20px 4px;
    }

    .sidebar-nav a {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; font-size: 13.5px; font-weight: 500;
      color: rgba(255,255,255,0.85); text-decoration: none;
      transition: background 0.15s, color 0.15s; position: relative;
    }

    .sidebar-nav a:hover { background: rgba(0,0,0,0.08); color: white; }

    .sidebar-nav a.active {
      background: white; color: var(--maroon); font-weight: 600;
    }

    .sidebar-nav a.active::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--maroon);
    }

    .nav-icon { width: 18px; height: 18px; opacity: 0.85; flex-shrink: 0; }

    .sidebar-footer {
      padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; gap: 10px;
    }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%; background: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--orange); flex-shrink: 0;
    }

    .sidebar-footer span { font-size: 13px; color: white; font-weight: 500; }

    /* ── MAIN ── */
    .main-wrap {
      margin-left: var(--sidebar-w);
      flex: 1; display: flex; flex-direction: column; min-height: 100vh;
    }

    .topbar {
      height: var(--header-h); background: white;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; position: sticky; top: 0; z-index: 50;
    }

    .topbar-left h1 { font-size: 17px; font-weight: 700; }
    .breadcrumb { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

    .topbar-right { display: flex; align-items: center; gap: 12px; }

    .icon-btn {
      width: 34px; height: 34px; border-radius: 8px;
      border: 1px solid var(--border); background: white;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s;
    }

    .icon-btn:hover { background: #f3f4f6; }

    /* ── CONTENT ── */
    .content { padding: 28px; flex: 1; }

    .content-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 24px;
    }

    .content-header h2 { font-size: 20px; font-weight: 700; }
    .content-header p { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* ── FORM CARD ── */
    .form-card {
      background: white; border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
      max-width: 720px;
    }

    .form-card-header {
      padding: 18px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }

    .form-card-header-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: #fff3e0;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .form-card-header h3 { font-size: 15px; font-weight: 700; }
    .form-card-header p { font-size: 12px; color: var(--muted); margin-top: 1px; }

    .form-body { padding: 24px; }

    .form-section-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 14px;
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--text); margin-bottom: 7px;
    }

    .field label span { color: #ef4444; margin-left: 2px; }

    .field input[type="text"],
    .field input[type="number"],
    .field textarea,
    .field select {
      width: 100%; padding: 9px 13px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; font-family: inherit; color: var(--text);
      background: white; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(242,140,40,0.12);
    }

    .field textarea { resize: vertical; min-height: 90px; }

    .field-hint { font-size: 11.5px; color: var(--muted); margin-top: 5px; }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* Photo upload */
    .photo-grid {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px;
    }

    .photo-item {
      position: relative; width: 90px; height: 90px;
    }

    .photo-item img {
      width: 100%; height: 100%; object-fit: cover;
      border-radius: 10px; border: 1px solid var(--border);
    }

    .remove-btn {
      position: absolute; top: -7px; right: -7px;
      width: 22px; height: 22px; border-radius: 50%;
      background: #ef4444; color: white; border: 2px solid white;
      font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1; transition: background 0.15s;
    }

    .remove-btn:hover { background: #dc2626; }

    .upload-box {
      width: 90px; height: 90px;
      border: 2px dashed #d1d5db; border-radius: 10px; background: #f9fafb;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; cursor: pointer; color: var(--muted);
      flex-shrink: 0; transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .upload-box:hover { border-color: var(--orange); color: var(--orange); background: #fff8f0; }

    .upload-box svg { margin-bottom: 4px; }
    .upload-box span { font-size: 10.5px; font-weight: 600; }

    /* Divider */
    .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* Form footer */
    .form-footer {
      padding: 18px 24px; border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 10px;
      background: #fafafa;
    }

    .btn-back {
      background: #f28c28; color: #fafafa;
      border: 1px solid var(--border); padding: 9px 20px;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: background 0.15s;
    }
    
    .btn-back:hover { background: #d97a1a; }

    .btn-cancel {
      background: white; color: var(--text);
      border: 1px solid var(--border); padding: 9px 20px;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: background 0.15s;
    }

    .btn-cancel:hover { background: #f3f4f6; }

    .btn-primary {
      background: var(--maroon); color: white; border: none;
      padding: 9px 22px; border-radius: 8px; font-size: 13px;
      font-weight: 600; font-family: inherit; cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-primary:hover { background: var(--maroon-dark); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    /* Toast */
    .toast {
      position: fixed; bottom: 28px; right: 28px;
      background: #1a1a2e; color: white;
      padding: 13px 20px; border-radius: 10px;
      font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transform: translateY(80px); opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 300;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span>gratefulgrapefruit Admin</span>
      <small>Management Panel</small>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Main</div>
      <a href="dashboard.html">
        <svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="products.html" class="active">
        <svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8a2 2 0 00-2 2v2h12V5a2 2 0 00-2-2z"/></svg>
        Products
      </a>
      <a href="gallery.html">
        <svg class="nav-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Gallery
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="avatar">A</div>
      <span>Admin</span>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-wrap">

    <header class="topbar">
      <div class="topbar-left">
        <h1>Add Product</h1>
        <span class="breadcrumb">Dashboard / Products / Add Product</span>
      </div>
      <div class="topbar-right">
        <div class="icon-btn">
          <svg width="16" height="16" fill="none" stroke="#6b7280" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="content-header">
        <div>
          <h2>Insert Product</h2>
          <p>Fill in the details below to add a new product</p>
        </div>
      </div>

      <div class="form-card">
        <div class="form-card-header">
          <div class="form-card-header-icon">
            <svg width="20" height="20" fill="none" stroke="#f28c28" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8a2 2 0 00-2 2v2h12V5a2 2 0 00-2-2z"/></svg>
          </div>
          <div>
            <h3>Product Details</h3>
            <p>Basic information about the product</p>
          </div>
        </div>

        <div class="form-body">
          <div class="form-section-label">General</div>

          <div class="field">
            <label for="productName">Product Name <span>*</span></label>
            <input type="text" id="productName" placeholder="e.g. Organic Honey 500ml" />
          </div>

          <div class="field">
            <label>Photos</label>
            <div class="photo-grid" id="photoGrid">
              <div class="upload-box" onclick="document.getElementById('photoInput').click()">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                <span>Upload</span>
              </div>
            </div>
            <input type="file" id="photoInput" accept="image/*" multiple style="display:none;" onchange="addPhotos(this)" />
          </div>
        </div>

        <div class="form-footer">
          <button class="btn-back" onclick="window.location.href='products.html'">Back</button>
          <button class="btn-cancel" onclick="resetForm()">Reset</button>
          <button class="btn-primary" onclick="insertProduct()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Insert Product
          </button>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast">
    <div class="toast-dot"></div>
    <span id="toastMsg">Product inserted successfully!</span>
  </div>
  
  <script>
    var photos = [];

    function addPhotos(input) {
      var files = Array.from(input.files);
      if (photos.length >= 1) {
        showToast('Only 1 photo allowed. Remove the current one first.', true); 
        input.value = ''; return;
      }
      var file = files[0];
      var reader = new FileReader();
      reader.onload = function(e) {
        photos.push({ name: file.name, src: e.target.result });
        renderPhotos();
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    function removePhoto(index) {
      photos.splice(index, 1);
      renderPhotos();
    }

    function renderPhotos() {
      var grid = document.getElementById('photoGrid');
      grid.innerHTML = '';
      photos.forEach(function(photo, index) {
        var item = document.createElement('div');
        item.className = 'photo-item';
        var img = document.createElement('img');
        img.src = photo.src; img.alt = photo.name;
        var btn = document.createElement('button');
        btn.className = 'remove-btn'; btn.innerHTML = '&times;';
        btn.onclick = (function(i) { return function() { removePhoto(i); }; })(index);
        item.appendChild(img); item.appendChild(btn);
        grid.appendChild(item);
      });
      if (photos.length < 1) {
        var uploadBox = document.createElement('div');
        uploadBox.className = 'upload-box';
        uploadBox.innerHTML = '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg><span>Upload</span>';
        uploadBox.onclick = function() { document.getElementById('photoInput').click(); };
        grid.appendChild(uploadBox);
      }
    }

    function resetForm() {
      document.getElementById('productName').value = '';
      photos = [];
      renderPhotos();
    }

    function insertProduct() {
      var name = document.getElementById('productName').value.trim();
      if (!name) { showToast('Please enter a product name.', true); return; }
      if (photos.length === 0) { showToast('Please upload a product photo.', true); return; }
      showToast('Product "' + name + '" inserted successfully!', false);
      setTimeout(resetForm, 1500);
    }

    function showToast(msg, isError) {
      var t = document.getElementById('toast');
      var dot = t.querySelector('.toast-dot');
      document.getElementById('toastMsg').textContent = msg;
      dot.style.background = isError ? '#f87171' : '#4ade80';
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 3000);
    }
  </script>

</body>
</html>
